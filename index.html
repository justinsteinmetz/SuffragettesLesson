<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suffragettes Lesson Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #2a1340;
  --panel: #3a1b58;
  --panel-2: #4a2370;
  --ink: #f6f1e7;
  --soft: #d6cae8;
  --purple: #b08be6;
  --green: #8ed1a4;
  --line: #6a4690;
  --warn: #ffd479;
  --font-display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Public Sans', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { font-size: clamp(15px, 1.1vw, 24px); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; text-transform: uppercase; line-height: 1.1; font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[inert] { pointer-events: none; }

.app { min-height: 100%; display: flex; flex-direction: column; gap: .9rem; padding: 1rem clamp(14px, 3vw, 56px) 1.1rem; max-width: 1920px; margin: 0 auto; }
.eyebrow { font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--green); font-size: 1rem; }

/* buttons */
.btn { border: 2px solid var(--line); background: var(--panel); border-radius: .6rem; padding: .55rem 1rem; font-weight: 600; min-height: 2.75rem; }
.btn:hover { background: var(--panel-2); }
.btn[aria-pressed="true"] { border-color: var(--green); }
.btn.primary { background: var(--green); color: #1c0c2e; border-color: var(--green); font-size: 1.6rem; padding: .8rem 2.2rem; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.btn.primary:hover { background: #a6e0b9; }
.btn.small { min-height: 2.4rem; padding: .35rem .8rem; }

/* start screen */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; }
.hero h1 { font-size: clamp(3rem, 9vw, 8rem); font-weight: 700; }
.hero .sub { font-size: 1.7rem; color: var(--soft); max-width: 40ch; }
.stripe { display: flex; width: min(600px, 100%); }
.stripe i { flex: 1; height: 1.1rem; display: block; }
.stripe i:nth-child(1) { background: #8a5fc8; }
.stripe i:nth-child(2) { background: var(--ink); }
.stripe i:nth-child(3) { background: var(--green); }
.stages { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; color: var(--soft); font-size: 1.1rem; list-style: none; padding: 0; }
.stages b { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.how { background: var(--panel); border-radius: 1rem; padding: 1rem 1.4rem; max-width: 64ch; font-size: 1.1rem; display: flex; flex-direction: column; gap: .3rem; }
.how b { color: var(--green); }
.opt { display: inline-flex; align-items: center; gap: .6rem; font-size: 1.15rem; font-weight: 600; }
.opt input { width: 1.4rem; height: 1.4rem; accent-color: #8ed1a4; }

/* lesson screen */
.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 1rem 2rem; }
.step-name { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.step-name h2 { font-size: clamp(1.9rem, 3.4vw, 3.4rem); outline: none; }
.step-name .part { font-size: 1.4rem; font-weight: 700; color: var(--soft); }
.timer { display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(3.5rem, 8vw, 7rem); line-height: 1; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--warn); }
.clock.over { color: var(--warn); }
.tstatus { color: var(--soft); font-size: 1.15rem; font-weight: 600; min-height: 1.6em; }
.tstatus.over { color: var(--warn); }
.tbtns { display: flex; gap: .5rem; }
.part-label { font-size: 1.4rem; font-weight: 700; color: var(--soft); }
main.lesson { display: flex; flex-direction: column; gap: .9rem; flex: 1; }
.instruction { font-size: clamp(1.4rem, 2.2vw, 2.2rem); line-height: 1.25; max-width: 60ch; font-weight: 600; text-wrap: pretty; }
.panel { display: grid; gap: 1.1rem; align-content: start; }
.panel.fill { flex: 1; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.split-img { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
@media (max-width: 900px) { .split, .split-img { grid-template-columns: 1fr; } }

.tile { background: var(--panel); border-radius: 1rem; padding: 1.1rem 1.4rem; display: flex; flex-direction: column; gap: .6rem; }
.tile h3 { font-size: 1.5rem; color: var(--green); }
.tile p, .tile li { font-size: 1.15rem; line-height: 1.5; }
.tile ul, .tile ol { padding-left: 1.2rem; display: flex; flex-direction: column; gap: .4rem; }
.tile.a { border-top: .45rem solid var(--purple); }
.tile.b { border-top: .45rem solid var(--green); }
.tile.big h3 { font-size: 2.2rem; }
.tile.big p { font-size: 1.45rem; color: var(--soft); }
.tile b { color: var(--green); font-weight: 700; }
.hint { background: var(--ink); color: #2a1340; border-radius: .8rem; padding: .6rem 1.2rem; font-weight: 700; font-size: 1.2rem; }
.hint.soft { background: var(--panel-2); color: var(--ink); font-weight: 600; }
.muted { color: var(--soft); }
.example { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; align-items: baseline; font-size: 1.25rem; }
.example .no { color: var(--warn); font-weight: 700; }
.example .yes { color: var(--green); font-weight: 700; }
.example span.k { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .05em; }

/* reading card */
.rcard { background: var(--panel); border-radius: 1rem; padding: 1.2rem 1.5rem 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
.rcard.a { border-top: .5rem solid var(--purple); }
.rcard.b { border-top: .5rem solid var(--green); }
.rcard .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.rcard .head h3 { font-size: 2rem; }
.rcard .head span { color: var(--soft); font-size: 1.05rem; font-weight: 600; }
.part { display: grid; grid-template-columns: 2.4rem 1fr; gap: .2rem .9rem; align-items: start; }
.part .num { background: var(--panel-2); border-radius: 50%; width: 2.4rem; height: 2.4rem; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
.part h4 { margin: 0; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; font-size: 1.3rem; font-weight: 600; color: var(--green); padding-top: .2rem; }
.part ul { grid-column: 2; padding-left: 1.1rem; display: flex; flex-direction: column; gap: .4rem; }
.part li { font-size: 1.12rem; line-height: 1.5; }
.part li::marker { color: var(--purple); }
.part b { color: var(--green); font-weight: 700; }
.part .nb { color: var(--soft); }
.dates { list-style: none; padding: 0; }
.dates li { display: grid; grid-template-columns: 6.2rem 1fr; gap: .8rem; padding: .45rem 0; border-top: 1px solid var(--line); }
.dates li:first-child { border-top: 0; }
.dates .d { color: var(--green); font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.35; }
.think { background: var(--panel-2); border-radius: .8rem; padding: .8rem 1.1rem; font-size: 1.12rem; }
.think b { color: var(--warn); }
.fig { margin: 0; display: flex; flex-direction: column; gap: .5rem; }
.fig img { width: 100%; height: auto; border-radius: .6rem; display: block; background: #000; }
.fig figcaption { color: var(--soft); font-size: 1rem; line-height: 1.4; }
.fig figcaption b { color: var(--ink); }
.credit { font-size: .85rem; color: var(--soft); }

/* figure svg */
.chartbox { background: var(--panel); border-radius: 1rem; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: .7rem; }
.chartbox h3 { font-size: 1.4rem; color: var(--green); }
svg.fig-svg { width: 100%; height: auto; max-height: 46vh; display: block; margin: 0 auto; }
svg .lbl { fill: #f6f1e7; font: 600 21px 'Public Sans', Arial, sans-serif; }
svg .yr { fill: #d6cae8; font: 600 19px 'Public Sans', Arial, sans-serif; }
svg .val { fill: #f6f1e7; font: 700 30px 'Oswald', Arial, sans-serif; }
svg .grid { stroke: #6a4690; stroke-width: 1; }
svg .axis { stroke: #d6cae8; stroke-width: 2; }
svg .lead { stroke: #b08be6; stroke-width: 2; }
svg .dot { fill: #b08be6; stroke: #2a1340; stroke-width: 3; }
svg .bar { fill: #8ed1a4; }
svg .war { stroke: #ffd479; stroke-width: 2; stroke-dasharray: 8 6; }
svg .warl { fill: #ffd479; font: 600 19px 'Public Sans', Arial, sans-serif; }
.legend { display: grid; gap: .3rem; font-size: 1.1rem; }
.legend b { color: var(--green); }

/* tick lists, rows, pills */
.checklist { list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: .5rem; }
.checklist li { display: flex; gap: .75rem; align-items: baseline; font-size: 1.3rem !important; }
.checklist li::before { content: ''; width: .95rem; height: .95rem; border: 2px solid var(--green); border-radius: .2rem; flex: none; transform: translateY(.1rem); }
.rows { display: flex; flex-direction: column; }
.rows div { display: grid; grid-template-columns: 9rem 1fr; gap: 1.2rem; padding: .8rem 0; border-top: 1px solid var(--line); align-items: baseline; }
.rows div:first-child { border-top: 0; }
.rows b { font-family: var(--font-display); text-transform: uppercase; font-size: 1.4rem; color: var(--green); font-weight: 600; }
.rows span { font-size: 1.35rem; }
.rows em { color: var(--soft); font-style: normal; font-size: 1.1rem; display: block; margin-top: .15rem; }
.pills { display: flex; flex-wrap: wrap; gap: .6rem; }
.pills span { background: var(--panel-2); border-radius: 2rem; padding: .45rem 1.1rem; font-size: 1.15rem; }
.question { font-size: clamp(1.8rem, 3.4vw, 3.4rem); font-family: var(--font-display); font-weight: 600; line-height: 1.15; color: var(--green); max-width: 28ch; text-wrap: balance; }
.q3 { counter-reset: q; list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: .9rem; }
.q3 li { counter-increment: q; display: grid; grid-template-columns: 2.6rem 1fr; gap: .8rem; font-size: 1.35rem !important; }
.q3 li::before { content: counter(q); background: var(--green); color: #1c0c2e; font-family: var(--font-display); font-weight: 700; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; }
.q3 em { display: block; color: var(--soft); font-style: normal; font-size: 1.05rem; margin-top: .15rem; }
.quote { border-left: .4rem solid var(--purple); padding-left: 1rem; font-size: 1.2rem; display: flex; flex-direction: column; gap: .35rem; }
.quote q { quotes: "“" "”"; }
.quote mark { background: transparent; color: var(--warn); font-weight: 700; }
.frames { display: flex; flex-direction: column; gap: .7rem; }
.frames p { font-size: 1.3rem; background: var(--panel-2); border-radius: .6rem; padding: .6rem 1rem; }
.frames u { text-decoration: none; border-bottom: 2px solid var(--green); padding: 0 1.2rem; }
.goal3 { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; font-size: 1.15rem; font-weight: 600; }
.goal3 span::before { content: '✓ '; color: var(--green); }

/* footer */
.bottom { display: flex; flex-direction: column; gap: .8rem; margin-top: auto; padding-top: .6rem; }
.track { display: flex; gap: 4px; }
.seg { background: var(--panel); border-radius: .3rem; overflow: hidden; position: relative; padding: .4rem .6rem .5rem; min-width: 0; }
.seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--panel-2); width: 0; }
.seg.done .fill { width: 100%; background: var(--line); }
.seg span { position: relative; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; color: var(--soft); }
.seg.current { outline: 2px solid var(--green); outline-offset: -2px; }
.seg.current span { color: var(--ink); font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.controls .spacer { flex: 1; }
@media (prefers-reduced-motion: no-preference) { .seg .fill { transition: width .5s linear; } }

/* overlay */
.overlay { position: fixed; inset: 0; background: var(--bg); overflow: auto; z-index: 10; padding: 1.25rem clamp(14px, 3vw, 56px) 2rem; display: flex; flex-direction: column; gap: 1.1rem; }
.overlay .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.overlay .bar h2 { font-size: 2.2rem; }
.overlay .bar div { display: flex; gap: .6rem; flex-wrap: wrap; }
.opts { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.opts .tile ol { padding-left: 1.3rem; }
.srcs { font-size: .95rem; color: var(--soft); display: flex; flex-direction: column; gap: .3rem; }
.srcs a { color: var(--green); }
.notes li { font-size: 1.05rem; }

/* pupil view */
.pupil-note { font-size: 1.2rem; color: var(--soft); max-width: 60ch; }

/* print */
#print { display: none; }
@media print {
  html { font-size: 10.5px; }
  @page { margin: 10mm; }
  body { background: #fff; color: #000; }
  .app, .overlay, #live { display: none !important; }
  #print { display: block; }
  #print .pg { break-after: page; padding: 0; }
  #print .pg:last-child { break-after: auto; }
  #print .rcard, #print .tile, #print .think, #print .chartbox { background: #fff; color: #000; border: 2px solid #000; border-radius: 8px; }
  #print .rcard .head span, #print .part .nb, #print .muted, #print .credit, #print .fig figcaption { color: #333; }
  #print .part h4, #print .dates .d, #print .part b, #print .tile b, #print .legend b, #print .tile h3, #print .chartbox h3 { color: #000; }
  #print .part h4 { text-decoration: underline; }
  #print .part .num { background: #000; color: #fff; }
  #print .think b, #print .fig figcaption b { color: #000; }
  #print .fig img { max-height: 200px; width: auto; max-width: 100%; }
  #print svg.fig-svg { max-height: 220px; }
  #print .rcard { gap: .55rem; padding: .8rem 1rem; }
  #print .part li { font-size: 1rem; }
  #print .dates li { border-color: #999; }
  #print svg .lbl, #print svg .val, #print svg .yr { fill: #000; }
  #print svg .grid { stroke: #bbb; }
  #print svg .axis { stroke: #000; }
  #print svg .lead { stroke: #555; }
  #print svg .dot { fill: #555; stroke: #fff; }
  #print svg .bar { fill: #555; }
  #print svg .war { stroke: #000; }
  #print svg .warl { fill: #000; }
  #print .checklist li::before { border-color: #000; }
  #print .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
}
.sheet { display: none; }
@media print { .sheet { display: grid; } }
</style>
</head>

<div class="app" id="app"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<div id="print" aria-hidden="true"></div>

        ] },
        { n: 2, name: 'The problem', items: [

        { n: 4, name: 'The people', items: [

  /* ---------- Shared-axis figure: Image 2 (action) above Image 3 (voters) ---------- */
  function figureSvg() {
    var X0 = 60, X1 = 940, Y0 = 1903, Y1 = 1929;
    function x(y) { return Math.round(X0 + (y - Y0) / (Y1 - Y0) * (X1 - X0)); }
    var ev = [
      [1903.8, 'WSPU founded', 'start'],
      [1908.8, 'Rush on Parliament', 'end'],
      [1910.9, 'Black Friday', 'end'],
      [1912.2, 'Window-smashing', 'end'],
      [1913.4, 'Arson, bombs, Davison', 'end']
    ];
    var ys = [226, 184, 142, 100, 58], axisY = 256, base = 520, per = 11.2, i, s = '';
    s += '<svg class="fig-svg" viewBox="0 0 1000 570" role="img" aria-labelledby="figt figd"><title id="figt">Timeline of the action, 1903 to 1928, above the number of women who could vote</title>' +
      '<desc id="figd">Events: WSPU founded 1903, rush on Parliament October 1908, Black Friday November 1910, window-smashing March 1912, arson, bombs and Emily Davison at the Derby in 1913, war stops the campaign August 1914. Women who could vote: none in 1914, 8.4 million in 1918, about 15 million in 1928.</desc>';
    [1905, 1910, 1915, 1920, 1925].forEach(function (g) {
      s += '<line class="grid" x1="' + x(g) + '" y1="10" x2="' + x(g) + '" y2="' + base + '"/>';
    });
    s += '<line class="axis" x1="' + X0 + '" y1="' + axisY + '" x2="' + X1 + '" y2="' + axisY + '"/>';
    for (i = 0; i < ev.length; i++) {
      s += '<line class="lead" x1="' + x(ev[i][0]) + '" y1="' + (ys[i] + 6) + '" x2="' + x(ev[i][0]) + '" y2="' + axisY + '"/>' +
        '<circle class="dot" cx="' + x(ev[i][0]) + '" cy="' + axisY + '" r="9"/>' +
        '<text class="lbl" text-anchor="' + ev[i][2] + '" x="' + (x(ev[i][0]) + (ev[i][2] === 'end' ? -12 : 12)) + '" y="' + (ys[i] + 7) + '">' + ev[i][1] + '</text>';
    }
    s += '<line class="war" x1="' + x(1914.6) + '" y1="10" x2="' + x(1914.6) + '" y2="' + base + '"/>';
    s += '<text class="warl" x="' + (x(1914.6) + 10) + '" y="' + 290 + '">War: campaign stops</text>';
    s += '<line class="axis" x1="' + X0 + '" y1="' + base + '" x2="' + X1 + '" y2="' + base + '"/>';
    [[1914, 0, '0'], [1918, 8.4, '8.4m'], [1928, 15, '15m']].forEach(function (b) {
      var h = Math.max(4, Math.round(b[1] * per)), bx = x(b[0]) - 20;
      s += '<rect class="bar" x="' + bx + '" y="' + (base - h) + '" width="40" height="' + h + '"/>' +
        '<text class="val" text-anchor="middle" x="' + x(b[0]) + '" y="' + (base - h - 10) + '">' + b[2] + '</text>';
    });
    [1905, 1910, 1915, 1920, 1925].forEach(function (g) {
      s += '<text class="yr" text-anchor="middle" x="' + x(g) + '" y="' + 552 + '">' + g + '</text>';
    });
    return s + '</svg>';
  }
  var LEGEND = '<span><b>1914</b> none: no woman could vote</span>' +
    '<span><b>1918</b> 8.4 million: women over 30 with property or a degree</span>' +
    '<span><b>1928</b> about 15 million: all women over 21</span>';
  function figureBox(withTitle, noLegend) {
    return '<div class="chartbox">' +
      (withTitle ? '<h3>Image 2: the action &nbsp;·&nbsp; Image 3: women with the vote</h3>' : '') +
      figureSvg() + (noLegend ? '' : '<div class="legend">' + LEGEND + '</div>') + '</div>';
  }
  function photoFig(forPrint) {
    return '<figure class="fig"><img src="' + IMG.hyde + '" alt="Black and white photograph: women at the front of a large procession, wearing sashes and carrying flowers and banners. Emmeline Pankhurst is on the left and Elizabeth Wolstenholme Elmy is the older woman in the centre.">' +
      '<figcaption><b>Image 1.</b> Women’s Sunday, Hyde Park, <b>21 June 1908</b>. Seven processions, about <b>30,000</b> women marching, and a far bigger crowd watching (estimates reach hundreds of thousands). Legal and peaceful. Colours: purple, white and green.</figcaption>' +
      '<span class="credit">Photograph from Sylvia Pankhurst, The Suffragette (1911). Public domain.</span></figure>';
  }

  /* ---------- Card renderers ---------- */
  function cardHtml(key, opts) {

      h += '<section class="part"><span class="num" aria-hidden="true">' + p.n + '</span><h4>' + p.name + '</h4>';
      if (p.dates) {
        h += '<ul class="dates">' + p.dates.map(function (d) { return '<li><span class="d">' + d[0] + '</span><span>' + d[1] + '</span></li>'; }).join('') + '</ul>';
      } else {
        h += '<ul>' + p.items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
      }
      h += '</section>';
    });
    h += key === 'A' ? photoFig() : figureBox(true);
    h += '<p class="think"><b>Think.</b> ' + c.think + '</p>';
    if (opts.task) h += '<p class="hint">' + opts.task + '</p>';
    return h + '</article>';
  }

    { stage: 4, part: 'Part 1: Look at the source', secs: 120,
      instr: 'A newspaper printed this the day after Black Friday. Read it like a historian.',
      panel: function () {
        return '<div class="panel split-img"><figure class="fig"><img style="max-height:50vh;width:auto;max-width:100%;margin:0 auto" src="' + IMG.mirror + '" alt="Front page of the Daily Mirror, Saturday 19 November 1910. One large photograph shows a woman lying on the ground in a street while several police officers stand over her. The headline says violent scenes at Westminster where many suffragettes were arrested while trying to force their way into the House of Commons.">' +
          '<span class="credit">The Daily Mirror, 19 November 1910, front page. Public domain.</span></figure>' +
          '<div class="panel"><ol class="tile q3">' +
          '<li><span>Who produced it?<em>A newspaper. Who read it? Why a photograph on the front page?</em></span></li>' +
          '<li><span>What perspective does it show?<em>Compare the words with the picture. Whose side is it on?</em></span></li>' +
          '<li><span>How might it change public opinion?<em>Would readers feel the women are dangerous, brave, or hurt?</em></span></li></ol>' +
          '<div class="tile quote"><span class="muted">Words from the headline and caption</span>' +
          '<q>…suffragettes were arrested while trying to <mark>force their way</mark> into the House of Commons.</q>' +
          '<q>…suffragettes used <mark>more frantic methods than ever before</mark>.</q>' +
          '<q>The photograph shows <mark>how far women will go for the vote</mark>.</q></div></div></div>';
      } },
    { stage: 4, part: 'Part 2: Write your verdict', secs: 120,
      instr: 'Together, write your opinion on paper as keywords.',
      panel: function () {
        return '<div class="panel"><div class="tile"><div class="rows">' +
          '<div><b>Verdict</b><span>How successful were they? Fully, partly or hardly?</span></div>' +
          '<div><b>Evidence 1</b><span>A date or a number that supports your verdict.<em>Think: 1918 and 1928.</em></span></div>' +
          '<div><b>Evidence 2</b><span>A second piece of evidence.<em>Think: Black Friday, 1912 to 1914, the source.</em></span></div>' +
          '<div><b>The limit</b><span>What complicates your verdict?<em>Who was left out? What else changed things: the suffragists, the war?</em></span></div></div></div>' +
          '<div class="pills"><span>On the one hand… on the other hand…</span><span>Although…</span><span>Historians disagree about…</span></div></div>';
      } },
    { stage: 5, part: 'Part 1: Talk', secs: 180,
      instr: 'Join another pair. Talk about this question.',
      panel: function () {
        return '<div class="panel"><p class="question">“How far should a group go to change a law it thinks is unfair?”</p>' +
          '<div class="panel cols-3">' +
          '<div class="tile"><h3>1</h3><p>Everyone speaks once before anyone speaks twice.</p></div>' +
          '<div class="tile"><h3>2</h3><p>Use evidence from your cards, the source, or another movement you know.</p></div>' +
          '<div class="tile"><h3>3</h3><p>Choose one idea to share with the class.</p></div></div></div>';
      } },
    { stage: 5, part: 'Part 2: Exit ticket', secs: 180,
      instr: 'On your own, write four sentences. Hand them in.',
      panel: function () {
        return '<div class="panel split"><div class="panel"><p class="question" style="font-size:clamp(1.6rem,2.8vw,2.8rem)">To what extent were the suffragettes successful?</p>' +
          '<div class="frames">' +
          '<p>1. In my view the suffragettes were <u>fully / partly / hardly</u> successful because…</p>' +
          '<p>2. For example, in <u>date</u>, <u>what happened</u>.</p>' +
          '<p>3. Another piece of evidence is <u>…</u>.</p>' +
          '<p>4. However / Although <u>a limit or complication</u>.</p></div></div>' +
          '<div class="panel"><div class="tile"><h3>You need</h3><div class="goal3"><span>a clear judgement</span><span>two pieces of evidence</span><span>one limit</span></div></div>' +
          '<div class="tile"><h3>Next lesson: your own</h3><ol><li>Choose a community effort from anywhere in the world.</li><li>Alone or in pairs. 45 minutes to research.</li><li>5 minutes. Maximum 3 images, each one explained.</li><li>Paper notes: keywords, dates and figures only.</li><li>Images and sources in your OneNote folder.</li><li>Finish with an open discussion question.</li></ol></div></div></div>';
      } }
  ];
  var STAGE_SECS = STAGES.map(function (_, s) { return SCREENS.filter(function (c) { return c.stage === s; }).reduce(function (a, c) { return a + c.secs; }, 0); });
  function partInfo(idx) {
    var sc = SCREENS[idx], sib = SCREENS.filter(function (c) { return c.stage === sc.stage; });
    return { n: sib.indexOf(sc) + 1, of: sib.length };
  }

  /* ---------- State ---------- */
  var app = document.getElementById('app'), live = document.getElementById('live');
  var S = { mode: 'start', idx: 0, timerOn: false, sound: true, running: false, remaining: 0, over: 0, expired: false, warned: false, last: 0, iv: null, ctx: null, pupil: null, overlayFrom: null };

  function announce(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 60); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }

  /* ---------- Timer (optional, never advances by itself) ---------- */
  function audio() {
    try { var C = window.AudioContext || window.webkitAudioContext; if (!C) return; if (!S.ctx) S.ctx = new C(); if (S.ctx.state === 'suspended') S.ctx.resume(); } catch (e) { /* sound is optional */ }
  }
  function chime() {
    if (!S.sound || !S.ctx) return;
    try {
      [[880, 0], [1318.5, 0.25]].forEach(function (n) {
        var o = S.ctx.createOscillator(), g = S.ctx.createGain(), t0 = S.ctx.currentTime + n[1];
        o.type = 'sine'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
        o.connect(g); g.connect(S.ctx.destination); o.start(t0); o.stop(t0 + 1);
      });
    } catch (e) { /* ignore */ }
  }
  function resetTimer() {
    S.remaining = SCREENS[S.idx].secs * 1000; S.over = 0; S.expired = false; S.warned = false; S.running = S.timerOn; S.last = Date.now();
  }
  function startLoop() { if (!S.iv) S.iv = setInterval(tick, 250); }
  function stopLoop() { if (S.iv) { clearInterval(S.iv); S.iv = null; } }
  function tick() {
    if (!S.timerOn || !S.running || S.mode !== 'lesson') return;
    var now = Date.now(), d = now - S.last; S.last = now;
    if (!S.expired) {
      S.remaining -= d;
      if (!S.warned && SCREENS[S.idx].secs > 60 && S.remaining <= 30000 && S.remaining > 0) { S.warned = true; announce('Thirty seconds left.'); }
      if (S.remaining <= 0) { S.over = -S.remaining; S.remaining = 0; S.expired = true; announce('Time is up for this part. Move on when you are ready.'); chime(); }
    } else { S.over += d; }
    paintClock();
  }
  function paintClock() {
    var c = document.getElementById('clock'); if (!c) return;
    c.textContent = S.expired ? '+' + fmt(S.over) : fmt(S.remaining);
    c.classList.toggle('low', !S.expired && S.remaining <= 30000);
    c.classList.toggle('over', S.expired);
    var t = document.getElementById('tstatus');
    t.textContent = S.expired ? 'Time is up. Move on when ready.' : (!S.running ? 'Paused' : (S.remaining <= 30000 ? '30 seconds left' : ''));
    t.classList.toggle('over', S.expired);
    var st = SCREENS[S.idx].stage, before = 0, i;
    for (i = 0; i < S.idx; i++) if (SCREENS[i].stage === st) before += SCREENS[i].secs;
    var el = SCREENS[S.idx].secs - S.remaining / 1000 + before;
    var seg = document.querySelector('.seg.current .fill');
    if (seg) seg.style.width = Math.min(100, el / STAGE_SECS[st] * 100) + '%';
  }

  /* ---------- Screens ---------- */
  function startScreen() {
    S.mode = 'start'; stopLoop();
    app.innerHTML =
      '<main class="hero">' +
      '<p class="eyebrow">Small actions, big changes</p>' +
      '<h1>Deeds, not words</h1>' +
      '<p class="sub">The suffragettes.</p>' +
      '<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>' +
      '<ol class="stages">' + STAGES.map(function (s, i) { return '<li><b>' + (i + 1) + '</b> ' + s + '</li>'; }).join('') + '</ol>' +
      '<div class="how"><span><b>How the cards work.</b> Pupils work in pairs. A reads Card A and B reads Card B. Each card is secret: they teach each other.</span>' +
      '<span>Hand out printed cards, or let pupils open their own card on an iPad. The board never shows both cards while pupils read.</span></div>' +
      '<div class="actions"><button class="btn primary" id="go">Start lesson</button>' +
      '<label class="opt"><input type="checkbox" id="topt"' + (S.timerOn ? ' checked' : '') + '> Use the timer</label></div>' +
      '<div class="actions"><button class="btn" id="pa">Pupil iPad: Card A</button><button class="btn" id="pb">Pupil iPad: Card B</button><button class="btn" id="tg">Teacher guide and print</button></div>' +
      '</main>';
    document.getElementById('go').addEventListener('click', function () {
      S.timerOn = document.getElementById('topt').checked; if (S.timerOn) { audio(); startLoop(); }
      S.idx = 0; S.mode = 'lesson'; resetTimer(); render(true);
    });
    document.getElementById('pa').addEventListener('click', function () { pupilScreen('A'); });
    document.getElementById('pb').addEventListener('click', function () { pupilScreen('B'); });
    document.getElementById('tg').addEventListener('click', function () { openTeacher(this); });
    document.getElementById('go').focus();
  }

  function pupilScreen(k) {
    S.mode = 'pupil'; S.pupil = k; stopLoop();
    app.innerHTML =
      '<main class="hero" style="justify-content:flex-start">' +
      '<p class="eyebrow">Pupil view · keep it to yourself</p>' +
      '<p class="pupil-note">Read your card. Then make a keyword card on paper: keywords, dates and numbers only. Do not show this screen to your partner. To change card, reload the page.</p>' +
      cardHtml(k, { task: 'Next: you will speak for about two and a half minutes from your keyword card.' }) + '</main>';
    window.scrollTo(0, 0);
    announce(CARDS[k].title + ' open.');
  }

  function render(focusTitle, focusId) {
    if (S.mode !== 'lesson') return;
    var sc = SCREENS[S.idx], pi = partInfo(S.idx);
    var segs = STAGES.map(function (n, i) {
      var cls = i < sc.stage ? 'seg done' : (i === sc.stage ? 'seg current' : 'seg');
      return '<div class="' + cls + '" style="flex:' + STAGE_SECS[i] + ' 1 0"><div class="fill"></div><span>' + n + '</span></div>';
    }).join('');
    var timerHtml = S.timerOn ?
      '<div class="timer"><div class="clock" id="clock" role="timer" aria-live="off"></div><div class="tstatus" id="tstatus"></div>' +
      '<div class="tbtns"><button class="btn" id="tpause">' + (S.running ? 'Pause' : 'Resume') + '</button><button class="btn" id="treset">Reset</button></div></div>' : '';
    app.innerHTML =
      '<header class="top"><div class="step-name"><p class="eyebrow">Stage ' + (sc.stage + 1) + ' of ' + STAGES.length + (pi.of > 1 ? ' · Part ' + pi.n + ' of ' + pi.of : '') + '</p>' +
      '<h2 id="title" tabindex="-1">' + STAGES[sc.stage] + '</h2>' + (sc.part ? '<p class="part-label">' + sc.part + '</p>' : '') + '</div>' + timerHtml + '</header>' +
      '<main class="lesson"><p class="instruction" id="instruction">' + sc.instr + '</p>' + sc.panel() + '</main>' +
      '<footer class="bottom"><div class="track" aria-hidden="true">' + segs + '</div>' +
      '<div class="controls"><button class="btn" id="back"' + (S.idx === 0 ? ' disabled' : '') + '>Back</button>' +
      '<button class="btn" id="next"' + (S.idx === SCREENS.length - 1 ? ' disabled' : '') + '>Next</button>' +
      '<button class="btn" id="tt" aria-pressed="' + S.timerOn + '">Timer: ' + (S.timerOn ? 'on' : 'off') + '</button>' +
      (S.timerOn ? '<button class="btn" id="snd" aria-pressed="' + S.sound + '">Sound: ' + (S.sound ? 'on' : 'off') + '</button>' : '') +
      '<button class="btn" id="tch">Teacher guide</button><button class="btn" id="fs">Full screen</button></div></footer>';
    bind(); if (S.timerOn) paintClock();
    if (focusId) { var f = document.getElementById(focusId); if (f) f.focus(); }
    else if (focusTitle) { document.getElementById('title').focus(); }
  }

  function go(i) {
    if (i < 0) return;
    if (i >= SCREENS.length) { announce('That is the end of the lesson.'); return; }
    S.idx = i; resetTimer(); render(true);
    announce('Stage ' + (SCREENS[i].stage + 1) + ' of ' + STAGES.length + ': ' + STAGES[SCREENS[i].stage] + (SCREENS[i].part ? '. ' + SCREENS[i].part : '') + '. ' + SCREENS[i].instr);
  }
  function setTimer(on) {
    S.timerOn = on; if (on) { audio(); startLoop(); resetTimer(); } else { S.running = false; stopLoop(); }
    render(false, 'tt'); announce('Timer ' + (on ? 'on' : 'off') + '.');
  }
  function bind() {
    function on(id, fn) { var e = document.getElementById(id); if (e) e.addEventListener('click', fn); }
    on('back', function () { go(S.idx - 1); });
    on('next', function () { go(S.idx + 1); });
    on('tt', function () { setTimer(!S.timerOn); });
    on('snd', function () { S.sound = !S.sound; audio(); render(false, 'snd'); });
    on('tpause', function () { S.running = !S.running; S.last = Date.now(); render(false, 'tpause'); });
    on('treset', function () { resetTimer(); render(false, 'treset'); announce('Timer reset.'); });
    on('tch', function () { openTeacher(document.getElementById('tch')); });
    on('fs', function () { try { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) { /* not allowed here */ } });
  }

  /* ---------- Teacher overlay ---------- */
  function openTeacher(from) {
    if (document.getElementById('overlay')) return;
    S.overlayFrom = from;
    var o = document.createElement('div');
    o.id = 'overlay'; o.className = 'overlay'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-labelledby', 'ot');
    o.innerHTML =
      '<div class="bar"><h2 id="ot">Teacher guide</h2><div><button class="btn" id="oprint">Print both cards and listening sheet</button><button class="btn" id="oclose">Close</button></div></div>' +
      '<section aria-labelledby="oh1"><h3 id="oh1" class="eyebrow">Handing out the cards</h3><div class="opts" style="margin-top:.6rem">' +
      '<div class="tile"><h3>On paper</h3><ol><li>Press Print (or Ctrl/Cmd+P). Page 1 is Card A, page 2 is Card B, page 3 is the listening sheet.</li><li>Give A their card and B theirs, face down.</li><li>Collect or keep them after the reading stage.</li></ol></div>' +
      '<div class="tile"><h3>On iPads</h3><ol><li>Each pupil opens this page on their iPad.</li><li>A taps “Pupil iPad: Card A”. B taps “Pupil iPad: Card B”.</li><li>Only that card appears. Reload to switch.</li></ol></div>' +
      '<div class="tile"><h3>On the board</h3><p>The board shows instructions and Image 1, 2 and 3 for the rounds, never both cards at once. Use this guide to see both cards.</p></div></div></section>' +
      '<section aria-labelledby="oh2"><h3 id="oh2" class="eyebrow">Both cards (teacher only)</h3><div class="panel cols-2" style="margin-top:.6rem">' + cardHtml('A') + cardHtml('B') + '</div></section>' +
      '<section aria-labelledby="oh3"><h3 id="oh3" class="eyebrow">Notes on the history</h3><div class="tile"><ul class="notes">' +
      '<li><b>Two events in 1908.</b> Women’s Sunday (21 June) was a peaceful WSPU rally. The “rush” on Parliament (13 October) was a call to the public to storm the House of Commons; the three leaders were arrested the day before, so about 60,000 people (many onlookers) met 5,000 police without them. Contemporary press blamed “unemployed and hooligans” in the crowd.</li>' +
      '<li><b>Militancy was gradual.</b> Heckling (1905), stone-throwing and window-breaking from 1908, mass window-smashing (1 March 1912), then arson and bombs from late 1912, peaking in 1913.</li>' +
      '<li><b>Davison.</b> Historians disagree about her intentions. She had two WSPU flags and a return ticket; the inquest recorded misadventure. Card B states only what is known.</li>' +
      '<li><b>1918.</b> The Act gave the vote to women over 30 who were local-government electors, or married to one, or university graduates; about 8.4 million (some sources say 8.5). Men over 21 all got the vote. Women under 30, many working-class women, and people in the Empire stayed excluded. 1928 added about five million women.</li>' +
      '<li><b>Suffragists and suffragettes.</b> The NUWSS had about 50,000 members by 1914 (estimates range up to 100,000). WSPU membership is uncertain. The press and the women themselves used the two words loosely. “Suffragettes” was coined by the Daily Mail in January 1906.</li>' +
      '<li><b>The Pankhursts.</b> Sylvia’s East London Federation was expelled in January 1914 and she became a socialist; Christabel and Emmeline backed the war; Adela moved to Australia in 1914. Emmeline later stood as a Conservative.</li>' +
      '<li><b>What historians argue.</b> Whether militancy helped or hurt, and how far the war work of women, the suffragists’ Labour alliance and party politics mattered in 1918.</li>' +
      '<li><b>Left out.</b> The vote in Britain did not reach the Empire. Even where women could vote, such as New Zealand (1893) and Australia (1902), Aboriginal and Māori women were treated unequally.</li></ul></div></section>' +
      '<section aria-labelledby="oh4"><h3 id="oh4" class="eyebrow">Sources</h3><div class="srcs">' +
      '<span>UK Parliament Living Heritage: Deeds not words, Cat and Mouse Act. parliament.uk</span>' +
      '<span>The National Archives: Suffragettes on file; Black Friday (blog.nationalarchives.gov.uk)</span>' +
      '<span>London Museum: Black Friday; Women’s Sunday; the 1908 “rush” handbill; hunger strikes</span>' +
      '<span>UK Votes for Women 100 (ukvote100.org): A Rush on the House of Commons, 13 October 1908</span>' +
      '<span>Surrey History Centre: bomb at Walton-on-the-Hill, 19 February 1913</span>' +
      '<span>Bow Street Police Museum: the 1912 window-smashing campaign</span>' +
      '<span>Representation of the People Act 1918 and Equal Franchise Act 1928 (legislation.gov.uk; Wikipedia summaries cross-checked)</span>' +
      '<span>History Today and Gullickson (Social Research, 2008) on Emily Davison</span>' +
      '<span>Images: Daily Mirror 19 Nov 1910 front page; photograph in S. Pankhurst, The Suffragette (1911); both public domain via Wikimedia Commons</span></div></section>';
    document.body.appendChild(o);
    app.inert = true; app.setAttribute('aria-hidden', 'true');
    document.getElementById('oclose').addEventListener('click', closeTeacher);
    document.getElementById('oprint').addEventListener('click', function () {
      try { window.print(); } catch (e) { announce('Printing is blocked here. Press Ctrl or Cmd and P.'); }
    });
    document.getElementById('oclose').focus();
  }
  function closeTeacher() {
    var o = document.getElementById('overlay'); if (!o) return;
    o.remove(); app.inert = false; app.removeAttribute('aria-hidden');
    var f = S.overlayFrom && document.body.contains(S.overlayFrom) ? S.overlayFrom : null;
    if (f) f.focus(); else if (S.mode === 'lesson') { var t = document.getElementById('title'); if (t) t.focus(); }
  }

  /* ---------- Print area ---------- */
  function buildPrint() {
    var sheetHalf = function (who, parts) {
      return '<div class="tile"><h3>Listener: ' + who + '</h3><p class="muted">Tick each part you hear.</p><ul class="checklist">' + parts.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul><p>One question I want to ask:</p><p>&nbsp;</p><p>&nbsp;</p></div>';
    };
    document.getElementById('print').innerHTML =
      '<div class="pg">' + cardHtml('A') + '</div><div class="pg">' + cardHtml('B') + '</div>' +
      '<div class="pg"><h2>Listening sheet</h2><div class="sheet" style="margin-top:12px">' +
      sheetHalf('B (listening to A)', ['1 Where and when', '2 The problem', '3 The goal', '4 The people', 'Image 1']) +
      sheetHalf('A (listening to B)', ['5 The action', '6 The result', 'Image 2', 'Image 3']) + '</div></div>';
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.getElementById('overlay')) { e.preventDefault(); closeTeacher(); return; }
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (S.mode !== 'lesson' || document.getElementById('overlay') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') go(S.idx + 1);
    else if (e.key === 'ArrowLeft') go(S.idx - 1);
    else if ((e.key === 'p' || e.key === 'P') && S.timerOn) { S.running = !S.running; S.last = Date.now(); render(false, 'tpause'); }
  });
  // keep focus inside the dialog
  document.addEventListener('focusin', function (e) {
    var o = document.getElementById('overlay'); if (o && !o.contains(e.target)) { var c = document.getElementById('oclose'); if (c) c.focus(); }
  });

  buildPrint();
  startScreen();
})();
</script>
</body>
</html>
